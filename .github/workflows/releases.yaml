name: Build Release

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Gofumpt
        run: |-
          go get mvdan.cc/gofumpt
          if [ "$(gofumpt -l . | wc -l)" -gt 0 ]; then gofumpt -d . && exit 1; fi

      - name: Go mod download
        run: go mod download

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build ./cmd/...

      - name: Go Test
        run: go test ./...

  release:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        if: success() && startsWith(github.ref, 'refs/tags/')
        with:
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD
        if: success() && startsWith(github.ref, 'refs/tags/')
        run: |-
          version="${GITHUB_REF_NAME#v}"
          sum=$(awk -v f="run-puppet_${version}_linux-amd64" '$2 == f { print $1 }' dist/sha256sums.txt)
          if [ -z "$sum" ]; then echo "no checksum for run-puppet_${version}_linux-amd64" >&2; exit 1; fi

          git fetch origin main
          git checkout -B main origin/main
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${sum}')/" \
            PKGBUILD
          if git diff --quiet PKGBUILD; then exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "PKGBUILD: checksum of the released v${version} binary" PKGBUILD
          git push origin main
